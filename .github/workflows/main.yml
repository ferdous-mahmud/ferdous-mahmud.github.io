name: build resume

on: push
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: install typst
      run: |
        set -euo pipefail
        TYPST_VERSION="0.13.1"
        curl -fsSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
        tar -xf typst.tar.xz
        echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      shell: bash

    - name: check typst
      run: typst --version
      shell: bash

    - name: build resume
      run: ./build.sh
      shell: bash

    - uses: actions/upload-artifact@v4
      with:
        name: Resume
        path: resume.pdf
        if-no-files-found: error
